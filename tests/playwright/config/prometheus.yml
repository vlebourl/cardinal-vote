# Prometheus configuration for Playwright test monitoring

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'playwright-e2e-tests'

rule_files:
  # Add any alerting rules here if needed
  # - "rules/*.yml"

scrape_configs:
  # Monitor the Cardinal Vote application during testing
  - job_name: 'cardinal-vote-e2e'
    static_configs:
      - targets: ['cardinal-vote-e2e:8000']
    metrics_path: '/api/metrics'
    scrape_interval: 5s
    scrape_timeout: 3s
    honor_labels: true
    params:
      format: ['prometheus']

  # Monitor PostgreSQL test database
  - job_name: 'postgres-playwright'
    static_configs:
      - targets: ['postgres-playwright:5432']
    scrape_interval: 10s
    scrape_timeout: 5s

  # Monitor Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s

  # Custom metrics for test performance
  - job_name: 'playwright-metrics'
    static_configs:
      - targets: ['playwright-runner:3000']
    metrics_path: '/test-metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    # Only scrape when tests are running
    params:
      module: ['playwright_tests']
