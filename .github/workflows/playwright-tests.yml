name: Playwright E2E Tests

on:
  push:
    branches: [main, develop/generalized-platform, 'feature/gp-**']
  pull_request:
    branches: [main, develop/generalized-platform]
  schedule:
    # Run tests daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - core-flows
          - advanced-scenarios
          - error-scenarios
      browser:
        description: 'Browser to test'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - chromium
          - firefox
          - webkit
      environment:
        description: 'Test environment'
        required: false
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # Security and dependency checks
  security-checks:
    name: Security & Dependency Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Check for security vulnerabilities
        run: |
          npx audit-ci --config .github/audit-ci.json || exit 1

  # Build and prepare test environment
  build-test-environment:
    name: Build Test Environment
    runs-on: ubuntu-latest
    needs: security-checks
    outputs:
      image-tag: ${{ steps.build.outputs.image-tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and cache application image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: |
            cardinal-vote:test-${{ github.sha }}
            cardinal-vote:latest-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set image tag output
        run: echo "image-tag=test-${{ github.sha }}" >> $GITHUB_OUTPUT

  # Core flow tests (critical path)
  test-core-flows:
    name: Test Core Flows
    runs-on: ubuntu-latest
    needs: build-test-environment
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1/3, 2/3, 3/3]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Start test environment
        run: |
          docker compose -f docker-compose.playwright.yml up -d --wait postgres-playwright cardinal-vote-e2e
          docker compose -f docker-compose.playwright.yml logs cardinal-vote-e2e

      - name: Wait for application to be ready
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:8000/api/health; do sleep 2; done'

      - name: Run Core Flow Tests
        run: |
          npx playwright test tests/playwright/tests/01-core-flows/ \
            --project=core-${{ matrix.browser }} \
            --shard=${{ matrix.shard }} \
            --reporter=html,json
        env:
          PLAYWRIGHT_WORKERS: 2

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results-core-${{ matrix.browser }}-${{ strategy.job-index }}
          path: |
            playwright-report/
            test-results/
          retention-days: 30

      - name: Cleanup test environment
        if: always()
        run: |
          docker compose -f docker-compose.playwright.yml down -v
          docker system prune -f

  # Advanced scenario tests
  test-advanced-scenarios:
    name: Test Advanced Scenarios
    runs-on: ubuntu-latest
    needs: [build-test-environment, test-core-flows]
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
        test-group: [modal-interactions, form-validation, responsive-design]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Start test environment
        run: |
          docker compose -f docker-compose.playwright.yml up -d --wait postgres-playwright cardinal-vote-e2e

      - name: Wait for application to be ready
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:8000/api/health; do sleep 2; done'

      - name: Run Advanced Scenario Tests
        run: |
          npx playwright test tests/playwright/tests/02-advanced-scenarios/${{ matrix.test-group }}.spec.js \
            --project=advanced-${{ matrix.browser }} \
            --reporter=html,json
        env:
          PLAYWRIGHT_WORKERS: 1

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results-advanced-${{ matrix.test-group }}-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 30

      - name: Cleanup test environment
        if: always()
        run: |
          docker compose -f docker-compose.playwright.yml down -v

  # Error scenario tests
  test-error-scenarios:
    name: Test Error Scenarios
    runs-on: ubuntu-latest
    needs: [build-test-environment, test-core-flows]
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]
        test-group: [network-errors, validation-errors]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Start test environment
        run: |
          docker compose -f docker-compose.playwright.yml up -d --wait postgres-playwright cardinal-vote-e2e

      - name: Wait for application to be ready
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:8000/api/health; do sleep 2; done'

      - name: Run Error Scenario Tests
        run: |
          npx playwright test tests/playwright/tests/03-error-scenarios/${{ matrix.test-group }}.spec.js \
            --project=error-scenarios \
            --reporter=html,json
        env:
          PLAYWRIGHT_WORKERS: 1

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results-error-${{ matrix.test-group }}-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 30

      - name: Cleanup test environment
        if: always()
        run: |
          docker compose -f docker-compose.playwright.yml down -v

  # Mobile device testing
  test-mobile-devices:
    name: Test Mobile Devices
    runs-on: ubuntu-latest
    needs: [build-test-environment, test-core-flows]
    strategy:
      fail-fast: false
      matrix:
        device: ['iPhone 13', 'Pixel 5', 'iPad']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start test environment
        run: |
          docker compose -f docker-compose.playwright.yml up -d --wait postgres-playwright cardinal-vote-e2e

      - name: Wait for application to be ready
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:8000/api/health; do sleep 2; done'

      - name: Run Mobile Device Tests
        run: |
          npx playwright test tests/playwright/tests/01-core-flows/ \
            --project=mobile-chrome \
            --reporter=html,json
        env:
          PLAYWRIGHT_WORKERS: 1

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results-mobile-${{ matrix.device }}
          path: |
            playwright-report/
            test-results/
          retention-days: 30

      - name: Cleanup test environment
        if: always()
        run: |
          docker compose -f docker-compose.playwright.yml down -v

  # Performance testing
  test-performance:
    name: Performance Testing
    runs-on: ubuntu-latest
    needs: [build-test-environment, test-core-flows]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start test environment
        run: |
          docker compose -f docker-compose.playwright.yml up -d --wait postgres-playwright cardinal-vote-e2e

      - name: Wait for application to be ready
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:8000/api/health; do sleep 2; done'

      - name: Run Performance Tests
        run: |
          npx playwright test tests/playwright/tests/ \
            --project=performance \
            --grep="performance|load|timing" \
            --reporter=html,json
        env:
          PLAYWRIGHT_WORKERS: 1

      - name: Generate Lighthouse Report
        run: |
          npm install -g @lhci/cli
          lhci autorun || echo "Lighthouse CI completed"

      - name: Upload performance results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-results
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          retention-days: 30

      - name: Cleanup test environment
        if: always()
        run: |
          docker compose -f docker-compose.playwright.yml down -v

  # Visual regression testing
  test-visual-regression:
    name: Visual Regression Testing
    runs-on: ubuntu-latest
    needs: [build-test-environment, test-core-flows]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start test environment
        run: |
          docker compose -f docker-compose.playwright.yml up -d --wait postgres-playwright cardinal-vote-e2e

      - name: Wait for application to be ready
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:8000/api/health; do sleep 2; done'

      - name: Run Visual Regression Tests
        run: |
          npx playwright test tests/playwright/tests/ \
            --project=visual-regression \
            --grep="visual|screenshot|appearance" \
            --reporter=html,json
        env:
          PLAYWRIGHT_WORKERS: 1

      - name: Upload visual test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-regression-results
          path: |
            playwright-report/
            test-results/
            test-results-visual/
          retention-days: 30

      - name: Cleanup test environment
        if: always()
        run: |
          docker compose -f docker-compose.playwright.yml down -v

  # Accessibility testing
  test-accessibility:
    name: Accessibility Testing
    runs-on: ubuntu-latest
    needs: [build-test-environment, test-core-flows]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start test environment
        run: |
          docker compose -f docker-compose.playwright.yml up -d --wait postgres-playwright cardinal-vote-e2e

      - name: Wait for application to be ready
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:8000/api/health; do sleep 2; done'

      - name: Run Accessibility Tests
        run: |
          npx playwright test tests/playwright/tests/ \
            --project=accessibility \
            --grep="accessibility|a11y|aria|keyboard" \
            --reporter=html,json
        env:
          PLAYWRIGHT_WORKERS: 1

      - name: Upload accessibility results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-results
          path: |
            playwright-report/
            test-results/
            accessibility-report/
          retention-days: 30

      - name: Cleanup test environment
        if: always()
        run: |
          docker compose -f docker-compose.playwright.yml down -v

  # Aggregate test results
  aggregate-results:
    name: Aggregate Test Results
    runs-on: ubuntu-latest
    needs:
      [
        test-core-flows,
        test-advanced-scenarios,
        test-error-scenarios,
        test-mobile-devices,
        test-performance,
        test-visual-regression,
        test-accessibility
      ]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download all test artifacts
        uses: actions/download-artifact@v4
        with:
          path: test-artifacts/

      - name: Merge test reports
        run: |
          npx playwright merge-reports test-artifacts/ --reporter=html,json

      - name: Generate comprehensive test report
        run: |
          node scripts/generate-test-summary.js test-artifacts/ > test-summary.md

      - name: Upload comprehensive test report
        uses: actions/upload-artifact@v4
        with:
          name: comprehensive-test-report
          path: |
            playwright-report/
            test-summary.md
            test-results/
          retention-days: 90

      - name: Comment PR with test results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('test-summary.md', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🎭 Playwright Test Results\n\n${summary}`
            });

  # Deploy test results to GitHub Pages
  deploy-test-reports:
    name: Deploy Test Reports
    runs-on: ubuntu-latest
    needs: aggregate-results
    if: github.ref == 'refs/heads/main' && always()
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Download comprehensive test report
        uses: actions/download-artifact@v4
        with:
          name: comprehensive-test-report
          path: ./public

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Notify on test completion
  notify-completion:
    name: Notify Test Completion
    runs-on: ubuntu-latest
    needs: [aggregate-results]
    if: always()
    steps:
      - name: Determine overall status
        id: status
        run: |
          if [[ "${{ needs.aggregate-results.result }}" == "success" ]]; then
            echo "status=✅ All tests passed" >> $GITHUB_OUTPUT
            echo "color=good" >> $GITHUB_OUTPUT
          else
            echo "status=❌ Some tests failed" >> $GITHUB_OUTPUT
            echo "color=danger" >> $GITHUB_OUTPUT
          fi

      - name: Send notification
        if: github.event_name != 'pull_request'
        run: |
          echo "Test execution completed: ${{ steps.status.outputs.status }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
